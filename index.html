<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. | Personal AI HUD</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
    body {
      background: radial-gradient(circle at center, #061826 0%, #01060a 100%);
      color: #00f3ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hud-container {
      width: 95%; max-width: 900px; height: 92vh;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15) inset;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; position: relative;
    }
    .top-bar {
      display: flex; justify-content: space-between;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding-bottom: 10px; font-size: 0.85rem; letter-spacing: 2px;
    }
    .online { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
    .core-section {
      display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0;
    }
    .reactor-wrapper {
      position: relative; width: 220px; height: 220px;
      display: flex; justify-content: center; align-items: center;
    }
    .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
    .ring-1 {
      width: 220px; height: 220px;
      border-top: 3px solid #00f3ff; border-bottom: 3px solid #00f3ff;
      animation: spin 8s linear infinite;
    }
    .ring-2 {
      width: 180px; height: 180px;
      border-left: 3px dashed #00f3ff; border-right: 3px dashed #00f3ff;
      animation: spin-reverse 5s linear infinite;
    }
    .ring-3 {
      width: 140px; height: 140px;
      border: 2px solid rgba(0, 243, 255, 0.5); box-shadow: 0 0 20px #00f3ff;
    }
    .reactor-wrapper.active .ring-3 {
      box-shadow: 0 0 45px #00f3ff, 0 0 80px #0088ff;
      transform: scale(1.08); transition: 0.3s ease;
    }
    #mic-btn {
      width: 105px; height: 105px; border-radius: 50%;
      background: rgba(0, 243, 255, 0.1); border: 2px solid #00f3ff;
      color: #00f3ff; font-weight: bold; font-size: 0.8rem;
      cursor: pointer; z-index: 5; text-shadow: 0 0 8px #00f3ff; transition: 0.3s;
    }
    #mic-btn:hover { background: rgba(0, 243, 255, 0.25); box-shadow: 0 0 20px #00f3ff; }
    #status-text { margin-top: 18px; font-size: 0.85rem; letter-spacing: 1.5px; color: #8be9fd; }
    .terminal-box {
      border: 1px solid rgba(0, 243, 255, 0.3);
      background: rgba(0, 15, 25, 0.7); padding: 15px; height: 32%;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #chat-log { overflow-y: auto; height: 75%; font-size: 0.85rem; line-height: 1.5; padding-right: 5px; }
    .user-msg { color: #ffffff; margin-bottom: 6px; }
    .ai-msg { color: #00f3ff; margin-bottom: 8px; }
    .input-area { display: flex; gap: 8px; }
    input {
      flex: 1; background: rgba(0, 243, 255, 0.08); border: 1px solid #00f3ff;
      color: #fff; padding: 8px 12px; outline: none; font-size: 0.85rem;
    }
    button {
      background: rgba(0, 243, 255, 0.15); border: 1px solid #00f3ff;
      color: #00f3ff; padding: 8px 14px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #00f3ff; color: #000; }
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: center; align-items: center; z-index: 20;
    }
    .hidden { display: none; }
    .modal-content {
      background: #03121c; border: 1px solid #00f3ff; padding: 25px;
      width: 90%; max-width: 400px; text-align: center;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
    }
    .modal-content p { font-size: 0.75rem; margin: 10px 0 15px; color: #a0e9ff; }
    .modal-actions { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
  </style>
</head>
<body>
  <div class="hud-container">
    <header class="top-bar">
      <div class="stat-box">SYSTEM: <span class="online">ONLINE</span></div>
      <div class="stat-box" id="clock">00:00:00</div>
      <div class="stat-box" id="battery">PWR: --%</div>
    </header>

    <main class="core-section">
      <div class="reactor-wrapper" id="reactor">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <button id="mic-btn" title="Click to Speak"><span>INITIATE</span></button>
      </div>
      <p id="status-text">Click the Core to Activate Voice Protocol</p>
    </main>

    <section class="terminal-box">
      <div id="chat-log">
        <p class="ai-msg">[J.A.R.V.I.S.]: Systems initialized. Awaiting your command, Boss.</p>
      </div>
      <div class="input-area">
        <input type="text" id="text-input" placeholder="Type command or speak..." />
        <button id="send-btn">EXEC</button>
        <button id="key-btn" title="Set Groq API Key">🔑 API</button>
      </div>
    </section>
  </div>

  <div id="api-modal" class="modal hidden">
    <div class="modal-content">
      <h3>ENTER GROQ API KEY</h3>
      <p>Your key stays safely in your browser's local storage.</p>
      <input type="password" id="api-key-input" placeholder="gsk_..." />
      <div class="modal-actions">
        <button id="save-key-btn">SAVE PROTOCOL</button>
        <button id="close-modal-btn">CANCEL</button>
      </div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById("mic-btn");
    const reactor = document.getElementById("reactor");
    const statusText = document.getElementById("status-text");
    const chatLog = document.getElementById("chat-log");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");

    const apiModal = document.getElementById("api-modal");
    const keyBtn = document.getElementById("key-btn");
    const saveKeyBtn = document.getElementById("save-key-btn");
    const closeModalBtn = document.getElementById("close-modal-btn");
    const apiKeyInput = document.getElementById("api-key-input");

    let isSpeaking = false;
    let chatHistory = [
      {
        role: "system",
        content:
          "You are J.A.R.V.I.S., Tony Stark's hyper-intelligent AI assistant. You possess complete A-to-Z real-world knowledge across science, coding, history, movies, current affairs, and daily life. Always address the user as 'Boss' or 'Sir'. Keep your answers sharp, accurate, slightly witty, and concise (2-4 sentences max so they sound natural when spoken aloud). Reply in the same language (English or Hinglish) the user uses. Never use markdown symbols like asterisks or bullet points."
      }
    ];

    setInterval(() => {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleTimeString();
    }, 1000);

    if ("getBattery" in navigator) {
      navigator.getBattery().then((battery) => {
        const updateBattery = () => {
          document.getElementById("battery").innerText = `PWR: ${Math.round(battery.level * 100)}%`;
        };
        updateBattery();
        battery.addEventListener("levelchange", updateBattery);
      });
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const jarvisVoice =
        voices.find((v) => v.lang.includes("en-GB")) ||
        voices.find((v) => v.lang.includes("en"));
      if (jarvisVoice) utterance.voice = jarvisVoice;
      utterance.pitch = 0.92;
      utterance.rate = 1.03;

      utterance.onstart = () => {
        isSpeaking = true;
        reactor.classList.add("active");
      };
      utterance.onend = () => {
        isSpeaking = false;
        reactor.classList.remove("active");
      };
      window.speechSynthesis.speak(utterance);
    }

    function addLog(sender, message, isUser = false) {
      const p = document.createElement("p");
      p.className = isUser ? "user-msg" : "ai-msg";
      p.innerText = `[${sender}]: ${message}`;
      chatLog.appendChild(p);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function processCommand(command) {
      const cleanCmd = command.toLowerCase().trim();
      addLog("BOSS", command, true);

      if (cleanCmd.startsWith("open ")) {
        const site = cleanCmd.replace("open ", "").trim();
        const urls = {
          youtube: "https://youtube.com",
          google: "https://google.com",
          github: "https://github.com",
          instagram: "https://instagram.com",
          whatsapp: "https://whatsapp.com",
          gmail: "https://google.com"
        };
        if (urls[site]) {
          const reply = `Launching ${site} interface now, Boss.`;
          addLog("J.A.R.V.I.S.", reply);
          speak(reply);
          window.open(urls[site], "_blank");
          return;
        }
      }

      const apiKey = (localStorage.getItem("GROQ_API_KEY") || "").trim();
      if (!apiKey) {
        const reply = "Boss, click the API button below and enter your free Groq API key to unlock my full A to Z global intelligence.";
        addLog("J.A.R.V.I.S.", reply);
        speak(reply);
        return;
      }

      statusText.innerText = "ACCESSING GLOBAL NEURAL NET...";
      chatHistory.push({ role: "user", content: command });

      if (chatHistory.length > 11) {
        chatHistory = [chatHistory.at(0), ...chatHistory.slice(-10)];
      }

      try {
